[project]
name = "workout-processor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["builder", "config", "printer", "reader", "workout_processor"]

[tool.setuptools.packages.find]
include = ["data*"]
