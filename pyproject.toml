[project]
name = "workout-processor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = ["pytest", "pylint"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["builder", "config", "printer", "reader", "workout_processor"]

[tool.setuptools.packages.find]
include = ["data*"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "invalid-name",
    "wrong-import-order",
    "wrong-import-position",
    "superfluous-parens",
    "singleton-comparison",
    "trailing-whitespace",
    "trailing-newlines",
    "line-too-long",
    "unused-import",
    "unused-variable",
    "pointless-statement",
    "pointless-string-statement",
    "fixme",
]
